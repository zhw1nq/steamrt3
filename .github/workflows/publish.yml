name: publish
on: [workflow_dispatch]

jobs:
  publish-docker-image-main:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & Publish Docker image for LATEST tag
        run: |
          docker build . -t ghcr.io/zhw1nq/steamrt3-pelican:latest -f docker/RT3-Dockerfile
          docker push ghcr.io/zhw1nq/steamrt3-pelican:latest

  publish-docker-image-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & Publish Docker image for DEV tag
        run: |
          docker build . -t ghcr.io/zhw1nq/steamrt3-pelican:dev -f docker/RT3-Dockerfile
          docker push ghcr.io/zhw1nq/steamrt3-pelican:dev